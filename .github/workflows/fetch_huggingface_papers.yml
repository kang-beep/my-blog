name: Fetch HuggingFace Daily Papers

on:
  schedule:
    # 10×/day, ~every 2.5h (UTC). KST = UTC+9.
    - cron: "0 0 * * *"
    - cron: "30 2 * * *"
    - cron: "0 5 * * *"
    - cron: "30 7 * * *"
    - cron: "0 10 * * *"
    - cron: "30 12 * * *"
    - cron: "0 15 * * *"
    - cron: "30 17 * * *"
    - cron: "0 20 * * *"
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      period:
        description: "Papers period to sync"
        type: choice
        options:
          - all
          - daily
          - weekly
          - monthly
        default: all
      skip_delete:
        description: "Skip deleting rows older than today (test)"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Sync Hugging Face papers to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PERIOD: ${{ inputs.period || 'all' }}
          SKIP_DELETE: ${{ inputs.skip_delete }}
        run: node scripts/github-actions/sync-huggingface-daily-papers.mjs

  # Runs only after sync succeeds. Uses upvote Top 5 + fingerprint skip.
  # continue-on-error: quota / Gemini outages must not mark the whole feed sync failed.
  digest:
    name: Summarize Hugging Face papers (Gemini)
    needs: sync
    if: success()
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Upsert AI digests (skip Gemini on fingerprint match)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PERIOD: ${{ inputs.period || 'all' }}
        run: npm run summarize:hf-papers
