name: Fetch GitHub Trending Repos

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      period:
        description: "RSS period to sync"
        type: choice
        options:
          - all
          - daily
          - weekly
          - monthly
        default: all
      skip_delete:
        description: "Skip deleting rows older than today (test)"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Verify RSS parser is present
        run: test -f scripts/sync/lib/githubTrendingRss.mjs

      - name: Verify RSS parser output
        run: |
          node --input-type=module -e "
          import { parseGithubTrendingRssItem } from './scripts/sync/lib/githubTrendingRss.mjs';
          const sample = {
            title: 'iptv-org/iptv',
            link: 'https://github.com/iptv-org/iptv',
            description: '<p>Collection of publicly available IPTV channels from all over the world</p><hr><h1>IPTV</h1>',
          };
          const parsed = parseGithubTrendingRssItem(sample);
          if (!parsed?.description || parsed.description.includes('<')) {
            throw new Error('RSS parser validation failed');
          }
          console.log('RSS parser OK:', parsed.description);
          "

      - name: Sync GitHub trending repos to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PERIOD: ${{ inputs.period || 'all' }}
          SKIP_DELETE: ${{ inputs.skip_delete }}
        run: node scripts/sync/sync-github-trending-repos.mjs
